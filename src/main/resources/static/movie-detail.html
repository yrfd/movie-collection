<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>电影详情 - 银幕记忆</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 导航栏 -->
<nav class="navbar">
  <div class="navbar-container">
    <div class="logo" onclick="window.location.href='dashboard.html'">🎬 银幕记忆</div>
    <div class="nav-links">
      <a href="dashboard.html">我的电影</a>
      <div class="user-info">
        <img id="navAvatar" src="/images/default-avatar.png" class="nav-avatar" style="display: none;">
        <span class="username" id="username"></span>
        <button class="logout-btn" onclick="logout()">退出</button>
      </div>
    </div>
  </div>
</nav>

<div class="container">
  <!-- 电影详情区域 -->
  <div id="movieDetailContainer"></div>

  <!-- 综合评分区域 -->
  <div id="averageRatingContainer" class="average-rating" style="margin-bottom: 24px; display: none;">
    <span class="average-rating-label">综合评分：</span>
    <span id="avgRatingStars"></span>
    <span id="avgRatingValue" style="margin-left: 8px; font-weight: 500;"></span>
    <span id="ratingCount" style="color: var(--gray-500); margin-left: 8px;"></span>
  </div>

  <!-- 发布评价按钮 -->
  <div style="margin-bottom: 24px;">
    <button class="btn btn-primary" id="openCommentBtn">📝 发布评价</button>
  </div>

  <!-- 评价列表 -->
  <h3 style="margin-bottom: 16px;">用户评价</h3>
  <div id="commentsList" class="comment-list"></div>
</div>

<!-- 发布/编辑评价模态框 -->
<div id="commentModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title" id="commentModalTitle">发布评价</h3>
      <button class="modal-close" id="closeCommentModalBtn">&times;</button>
    </div>
    <div class="modal-body">
      <form id="commentForm">
        <input type="hidden" id="editCommentId">
        <div class="form-group">
          <label class="form-label">评价内容</label>
          <textarea id="commentContent" class="form-textarea" placeholder="分享你的观影感受..." maxlength="500"></textarea>
          <span class="form-hint" id="charCount">0/500</span>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancelCommentBtn">取消</button>
      <button class="btn btn-primary" id="submitCommentBtn">发布</button>
    </div>
  </div>
</div>

<!-- 删除评价确认模态框 -->
<div id="deleteCommentModal" class="modal">
  <div class="modal-content" style="max-width: 400px;">
    <div class="modal-header">
      <h3 class="modal-title">确认删除</h3>
      <button class="modal-close" id="closeDeleteCommentModalBtn">&times;</button>
    </div>
    <div class="modal-body">
      <p>确定要删除这条评价吗？此操作不可恢复。</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancelDeleteCommentBtn">取消</button>
      <button class="btn btn-danger" id="confirmDeleteCommentBtn">确认删除</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
  let movieId = null;
  let movieDetail = null;
  let comments = [];
  let editingCommentId = null;
  let deleteTargetCommentId = null;
  let userRating = 0;  // 用户的收藏评分

  // 页面初始化
  document.addEventListener('DOMContentLoaded', async () => {
    const user = getCurrentUser();
    if (!user) {
      window.location.href = 'index.html';
      return;
    }
    document.getElementById('username').textContent = user.username || '用户';

    const urlParams = new URLSearchParams(window.location.search);
    let idParam = urlParams.get('id');
    let tmdbIdParam = urlParams.get('tmdbId');

    // 处理 tmdbId 参数
    if (tmdbIdParam && !idParam) {
      try {
        // 1. 先查询本地是否有该电影的记录
        const moviesResult = await movieAPI.getAllMovies();
        let existingMovie = null;

        if (moviesResult.code === 200) {
          existingMovie = moviesResult.data.find(m => m.tmdbId == tmdbIdParam);
        }

        if (existingMovie) {
          // 已有记录，直接使用
          movieId = existingMovie.movieId;
        } else {
          // 2. 没有记录，从 TMDB 获取电影信息并自动创建
          showToast('正在获取电影信息...', 'info');

          const tmdbResponse = await fetch(`${API_BASE_URL}/tmdb/movie/${tmdbIdParam}`);
          const tmdbMovie = await tmdbResponse.json();

          // 解析导演
          let director = '';
          if (tmdbMovie.credits && tmdbMovie.credits.crew) {
            const directorObj = tmdbMovie.credits.crew.find(person => person.job === 'Director');
            if (directorObj) director = directorObj.name;
          }

          // 解析类型
          let genre = '';
          if (tmdbMovie.genres && tmdbMovie.genres.length > 0) {
            genre = tmdbMovie.genres.map(g => g.name).join('、');
          }

          // 解析地区
          let region = '';
          if (tmdbMovie.production_countries && tmdbMovie.production_countries.length > 0) {
            region = tmdbMovie.production_countries[0].name;
          }

          // 自动创建电影记录（不设置个人评分、观看状态等）
          const movieData = {
            tmdbId: parseInt(tmdbIdParam),
            movieName: tmdbMovie.title,
            director: director,
            year: tmdbMovie.release_date ? parseInt(tmdbMovie.release_date.split('-')[0]) : null,
            posterUrl: tmdbMovie.poster_path ? 'https://image.tmdb.org/t/p/w500' + tmdbMovie.poster_path : '',
            genre: genre,
            region: region,
            personalRating: 0,
            watchStatus: '想看',
            privateReview: ''
          };

          const token = localStorage.getItem('token');

          if (!token) {
            showToast('请先登录', 'error');
            window.location.href = 'login.html';
            return;
          }

          const createResult = await fetch(`${API_BASE_URL}/movie/add-to-library`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              tmdbId: parseInt(tmdbIdParam),
              movieName: tmdbMovie.title,
              director: director,
              year: tmdbMovie.release_date ? parseInt(tmdbMovie.release_date.split('-')[0]) : null,
              posterUrl: tmdbMovie.poster_path ? 'https://image.tmdb.org/t/p/w500' + tmdbMovie.poster_path : '',
              genre: genre,
              region: region
            })
          });
          const createResultData = await createResult.json();

          if (createResultData.code === 200) {
            movieId = createResultData.data.movieId;
            showToast('电影信息已获取', 'success');
          }
        }
      } catch (error) {
        console.error('获取电影信息失败:', error);
        showToast('获取电影信息失败，请重试', 'error');
        window.location.href = 'index.html';
        return;
      }
    } else if (idParam) {
      movieId = idParam;
    }

    if (!movieId) {
      window.location.href = 'dashboard.html';
      return;
    }

    await loadMovieDetail();
    await loadUserRating();
    await loadComments();
    await loadAverageRating();
    initCharCount();
    bindEvents();
  });

  // 加载电影详情
  async function loadMovieDetail() {
    try {
      // 先从用户收藏中查找
      const collectionsResult = await movieAPI.getAllMovies();
      if (collectionsResult.code === 200) {
        movieDetail = collectionsResult.data.find(m => m.movieId == movieId);
      }

      // 如果收藏中没有，从公共库获取基本信息
      if (!movieDetail) {
        const infoResponse = await fetch(`${API_BASE_URL}/movie/info/${movieId}`);
        const infoResult = await infoResponse.json();
        if (infoResult.code === 200) {
          movieDetail = infoResult.data;
          // 为未收藏的电影设置默认的个人评分和状态
          movieDetail.personalRating = 0;
          movieDetail.watchStatus = '未收藏';
          movieDetail.privateReview = '';
        }
      }

      if (movieDetail) {
        renderMovieDetail();
      } else {
        showToast('电影不存在', 'error');
        setTimeout(() => window.location.href = 'dashboard.html', 1500);
      }
    } catch (error) {
      console.error('加载电影详情失败:', error);
      showToast('加载失败', 'error');
      setTimeout(() => window.location.href = 'dashboard.html', 1500);
    }
  }

  // 加载用户的收藏评分
  async function loadUserRating() {
    try {
      const result = await movieAPI.getAllMovies();
      if (result.code === 200) {
        const movie = result.data.find(m => m.movieId == movieId);
        if (movie && movie.personalRating) {
          userRating = movie.personalRating;
        } else {
          userRating = 0;
        }
      }
    } catch (error) {
      console.error('加载用户评分失败:', error);
      userRating = 0;
    }
  }

  function renderMovieDetail() {
    const container = document.getElementById('movieDetailContainer');
    container.innerHTML = `
      <div class="movie-detail-header">
        <img src="${movieDetail.posterUrl || 'https://via.placeholder.com/240x360?text=No+Poster'}"
             class="movie-detail-poster"
             onerror="this.src='https://via.placeholder.com/240x360?text=No+Poster'">
        <div class="movie-detail-info">
          <h1 class="movie-detail-title">${escapeHtml(movieDetail.movieName)}</h1>
          <div class="movie-detail-meta">
            <p>导演：${escapeHtml(movieDetail.director || '未知')}</p>
            <p>主演：${escapeHtml(movieDetail.actors || '暂无信息')}</p>
            <p>年份：${movieDetail.year || '未知'}</p>
            <p>地区：${movieDetail.region || '未知'}</p>
            <p>类型：${movieDetail.genre || '未知'}</p>
          </div>
          <div class="my-rating">
            <span style="font-weight: 500;">我的评分：</span>
            <span id="myRatingStars">${movieDetail.personalRating ? renderStars(movieDetail.personalRating, 'small') : '暂无评分'}</span>
            <span id="myRatingValue" style="margin-left: 8px; color: var(--gray-500);">${movieDetail.personalRating ? movieDetail.personalRating.toFixed(1) + '分' : ''}</span>
          </div>
        </div>
      </div>
    `;
  }

  // 加载综合评分
  async function loadAverageRating() {
    try {
      const result = await commentAPI.getAverageRating(movieId);
      if (result.code === 200 && result.data && result.data.avgRating > 0) {
        const avgRating = result.data.avgRating;
        const count = result.data.count;

        document.getElementById('averageRatingContainer').style.display = 'block';
        document.getElementById('avgRatingStars').innerHTML = renderStars(avgRating, 'small');
        document.getElementById('avgRatingValue').textContent = avgRating.toFixed(1);
        document.getElementById('ratingCount').textContent = `(${count}人评价)`;
      }
    } catch (error) {
      console.error('加载评分失败:', error);
    }
  }


  function renderComments() {
    const container = document.getElementById('commentsList');
    const currentUser = getCurrentUser();
    const MAX_DEPTH = 1;

    // 背景颜色数组
    const bgColors = [
      '',
      'var(--gray-50)',
      'var(--gray-100)',
      'var(--primary-light)'
    ];

    if (comments.length === 0) {
      container.innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">💬</div>
                <p class="empty-state-text">暂无评价，成为第一个评价的人吧</p>
            </div>
        `;
      return;
    }

    // 构建用户名映射表
    const userMap = new Map();
    function buildUserMap(commentList) {
      commentList.forEach(comment => {
        userMap.set(comment.commentId, comment.username);
        if (comment.replies && comment.replies.length > 0) {
          buildUserMap(comment.replies);
        }
      });
    }
    buildUserMap(comments);

    // 递归渲染评论
    function renderCommentTree(comment, level = 0) {
      const isOwner = currentUser && comment.userId === currentUser.userId;
      const bgColorIndex = Math.min(level, bgColors.length - 1);
      const bgColor = bgColors[bgColorIndex];
      const bgStyle = bgColor ? `background-color: ${bgColor};` : '';
      const indentStyle = level > 0 ? `margin-left: ${Math.min(level * 20, 60)}px;` : '';

      // 获取点赞状态
      const isLiked = comment.isLiked === true;
      const likeIcon = isLiked ? '❤️' : '🤍';
      const likeCount = comment.likeCount || 0;

      // 获取被回复的用户名
      let replyInfo = '';
      if (comment.replyTo && comment.replyTo !== 0) {
        const repliedUsername = userMap.get(comment.replyTo);
        if (repliedUsername) {
          replyInfo = `<span style="font-size: 11px; color: var(--gray-500); margin-left: 6px;">回复 @${maskUsername(repliedUsername)}</span>`;
        }
      }

      // 处理子回复
      let repliesHtml = '';
      const hasReplies = comment.replies && comment.replies.length > 0;
      const repliesId = `replies-${comment.commentId}`;

      if (hasReplies) {
        if (level < MAX_DEPTH) {
          repliesHtml = `
                    <div class="replies-container" id="${repliesId}">
                        ${comment.replies.map(reply => renderCommentTree(reply, level + 1)).join('')}
                    </div>
                `;
        } else {
          repliesHtml = `
                    <div class="collapsed-wrapper" style="margin-top: 8px;">
                        <button class="toggle-replies-btn" data-target="${repliesId}" data-collapsed="true"
                                style="background: none; border: none; color: var(--primary); font-size: 12px; cursor: pointer; padding: 4px 8px; display: flex; align-items: center; gap: 4px;">
                            <span class="toggle-icon">▶</span> 展开 ${comment.replies.length} 条回复...
                        </button>
                        <div class="replies-container collapsed" id="${repliesId}" style="display: none;">
                            ${comment.replies.map(reply => renderCommentTree(reply, level + 1)).join('')}
                        </div>
                    </div>
                `;
        }
      }

      const avatarUrl = comment.userAvatar || '/images/default-avatar.png';
      const hasRating = comment.currentRating && comment.currentRating > 0;
      const ratingHtml = hasRating ? renderStars(comment.currentRating, 'small') : '<span style="font-size: 12px; color: var(--gray-400);">暂无评分</span>';

      return `
          <div class="comment-item" data-comment-id="${comment.commentId}"
               style="border-radius: var(--radius-md); padding: 12px; margin-bottom: 12px; ${bgStyle} ${indentStyle} border: 1px solid var(--gray-200);">
              <div class="comment-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px;">
                  <div class="comment-user" style="display: flex; align-items: center; gap: 8px;">
                      <!-- 图片头像 -->
                      <img src="${comment.userAvatar || '/images/default-avatar.png'}"
                           class="comment-avatar"
                           style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: linear-gradient(135deg, var(--primary), var(--secondary));"
                           onerror="this.onerror=null; this.src='/images/default-avatar.png';">
                      <span style="font-weight: 500; font-size: 0.85rem;">${maskUsername(comment.username)}</span>
                      ${replyInfo}
                  </div>
                  <span class="comment-time" style="font-size: 11px; color: var(--gray-400);">${formatDate(comment.createTime)}</span>
              </div>
              <div class="comment-rating" style="margin: 6px 0;">
                ${comment.snapshotRating && comment.snapshotRating > 0 ? renderStars(comment.snapshotRating, 'small') : '<span style="font-size: 12px; color: var(--gray-400);">📝 纯文本评价</span>'}
              </div>
              <div class="comment-content" style="font-size: 0.85rem; line-height: 1.5; color: var(--gray-700);">${escapeHtml(comment.content)}</div>
              <div class="comment-actions" style="display: flex; gap: 12px; margin-top: 10px;">
                  <button class="btn-like" data-id="${comment.commentId}" data-liked="${isLiked}"
                          style="background: none; border: none; font-size: 12px; cursor: pointer; padding: 4px 8px; border-radius: 20px; transition: all 0.2s; color: ${isLiked ? '#ef4444' : 'var(--gray-500)'};">
                      ${likeIcon} <span class="like-count">${likeCount}</span>
                  </button>
                  <button class="btn-reply" data-id="${comment.commentId}" data-username="${escapeHtml(comment.username)}"
                          style="background: none; border: none; color: var(--gray-500); font-size: 12px; cursor: pointer; padding: 4px 8px; border-radius: 20px; transition: all 0.2s;">
                      💬 回复
                  </button>
                  ${isOwner ? `
                      <button class="btn-edit" data-id="${comment.commentId}"
                              style="background: none; border: none; color: var(--gray-500); font-size: 12px; cursor: pointer; padding: 4px 8px; border-radius: 20px; transition: all 0.2s;">编辑</button>
                      <button class="btn-delete" data-id="${comment.commentId}"
                              style="background: none; border: none; color: var(--danger); font-size: 12px; cursor: pointer; padding: 4px 8px; border-radius: 20px; transition: all 0.2s;">删除</button>
                  ` : ''}
              </div>
              <div class="reply-input-area" id="reply-area-${comment.commentId}" style="display: none; margin-top: 12px;">
                  <div style="display: flex; gap: 8px;">
                      <textarea id="reply-text-${comment.commentId}" rows="2"
                                style="flex: 1; padding: 8px; border: 1px solid var(--gray-300); border-radius: var(--radius-sm); font-size: 13px; resize: vertical;"
                                placeholder="回复 ${escapeHtml(comment.username)}..."></textarea>
                      <div style="display: flex; flex-direction: column; gap: 4px;">
                          <button class="btn-submit-reply btn-primary btn-sm" data-id="${comment.commentId}" style="padding: 4px 12px;">发送</button>
                          <button class="btn-cancel-reply btn-secondary btn-sm" data-id="${comment.commentId}" style="padding: 4px 12px;">取消</button>
                      </div>
                  </div>
              </div>
              ${repliesHtml}
          </div>
      `;
    }

    // 渲染顶级评论
    container.innerHTML = comments.map(comment => renderCommentTree(comment, 0)).join('');

    // ========== 使用事件委托绑定点赞事件 ==========
    if (window._likeDelegateHandler) {
      container.removeEventListener('click', window._likeDelegateHandler);
    }

    const likeDelegateHandler = async (e) => {
      let targetBtn = e.target.closest('.btn-like');
      if (!targetBtn) return;

      e.stopPropagation();

      const commentId = parseInt(targetBtn.dataset.id);
      const token = localStorage.getItem('token');

      if (!token) {
        showToast('请先登录', 'warning');
        return;
      }

      const currentLikeSpan = targetBtn.querySelector('.like-count');
      const currentHtml = targetBtn.innerHTML;
      const currentIsLiked = currentHtml.includes('❤️');
      const currentCount = parseInt(currentLikeSpan?.textContent || '0');

      const originalHtml = targetBtn.innerHTML;

      if (currentIsLiked) {
        targetBtn.innerHTML = `🤍 <span class="like-count">${currentCount - 1}</span>`;
        targetBtn.style.color = 'var(--gray-500)';
        targetBtn.dataset.liked = 'false';
      } else {
        targetBtn.innerHTML = `❤️ <span class="like-count">${currentCount + 1}</span>`;
        targetBtn.style.color = '#ef4444';
        targetBtn.dataset.liked = 'true';
      }

      targetBtn.disabled = true;
      targetBtn.style.opacity = '0.6';

      try {
        const result = await commentAPI.likeComment(commentId);

        if (result.code === 200) {
          const likeSpan = targetBtn.querySelector('.like-count');
          if (likeSpan) {
            likeSpan.textContent = result.data;
          }
          const shouldBeRed = result.liked;
          if (shouldBeRed) {
            targetBtn.style.color = '#ef4444';
          } else {
            targetBtn.style.color = 'var(--gray-500)';
          }
        } else {
          targetBtn.innerHTML = originalHtml;
          targetBtn.style.color = currentIsLiked ? '#ef4444' : 'var(--gray-500)';
          showToast(result.message || '操作失败', 'error');
        }
      } catch (error) {
        console.error('点赞失败:', error);
        targetBtn.innerHTML = originalHtml;
        targetBtn.style.color = currentIsLiked ? '#ef4444' : 'var(--gray-500)';
        showToast('操作失败，请重试', 'error');
      } finally {
        targetBtn.disabled = false;
        targetBtn.style.opacity = '1';
      }
    };

    window._likeDelegateHandler = likeDelegateHandler;
    container.addEventListener('click', likeDelegateHandler);

    // ========== 绑定展开/折叠事件 ==========
    document.querySelectorAll('.toggle-replies-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const targetId = btn.dataset.target;
        const repliesContainer = document.getElementById(targetId);
        const icon = btn.querySelector('.toggle-icon');
        const isCollapsed = btn.dataset.collapsed === 'true';

        if (repliesContainer) {
          if (isCollapsed) {
            repliesContainer.style.display = 'block';
            if (icon) icon.textContent = '▼';
            btn.dataset.collapsed = 'false';
            btn.innerHTML = `<span class="toggle-icon">▼</span> 收起回复...`;
          } else {
            repliesContainer.style.display = 'none';
            if (icon) icon.textContent = '▶';
            btn.dataset.collapsed = 'true';
            const countMatch = btn.innerHTML.match(/\d+/);
            const count = countMatch ? countMatch[0] : '';
            btn.innerHTML = `<span class="toggle-icon">▶</span> 展开 ${count} 条回复...`;
          }
        }
      };
    });

    // ========== 绑定回复按钮事件 ==========
    if (window._replyDelegateHandler) {
      container.removeEventListener('click', window._replyDelegateHandler);
    }

    const replyDelegateHandler = (e) => {
      let targetBtn = e.target.closest('.btn-reply');
      if (!targetBtn) return;

      e.stopPropagation();
      const commentId = parseInt(targetBtn.dataset.id);
      document.querySelectorAll('.reply-input-area').forEach(area => {
        area.style.display = 'none';
      });
      const replyArea = document.getElementById(`reply-area-${commentId}`);
      if (replyArea) {
        replyArea.style.display = 'block';
        const textarea = document.getElementById(`reply-text-${commentId}`);
        if (textarea) textarea.focus();
      }
    };

    window._replyDelegateHandler = replyDelegateHandler;
    container.addEventListener('click', replyDelegateHandler);

    // 取消回复按钮
    if (window._cancelReplyDelegateHandler) {
      container.removeEventListener('click', window._cancelReplyDelegateHandler);
    }

    const cancelReplyDelegateHandler = (e) => {
      let targetBtn = e.target.closest('.btn-cancel-reply');
      if (!targetBtn) return;

      e.stopPropagation();
      const commentId = parseInt(targetBtn.dataset.id);
      const replyArea = document.getElementById(`reply-area-${commentId}`);
      if (replyArea) replyArea.style.display = 'none';
      const textarea = document.getElementById(`reply-text-${commentId}`);
      if (textarea) textarea.value = '';
    };

    window._cancelReplyDelegateHandler = cancelReplyDelegateHandler;
    container.addEventListener('click', cancelReplyDelegateHandler);

    // 提交回复按钮
    if (window._submitReplyDelegateHandler) {
      container.removeEventListener('click', window._submitReplyDelegateHandler);
    }

    const submitReplyDelegateHandler = async (e) => {
      let targetBtn = e.target.closest('.btn-submit-reply');
      if (!targetBtn) return;

      e.stopPropagation();
      const parentCommentId = parseInt(targetBtn.dataset.id);
      const textarea = document.getElementById(`reply-text-${parentCommentId}`);
      const content = textarea.value.trim();

      if (!content) {
        showToast('请输入回复内容', 'error');
        return;
      }
      if (content.length > 500) {
        showToast('回复内容不能超过500字符', 'error');
        return;
      }

      targetBtn.disabled = true;
      targetBtn.textContent = '发送中...';

      try {
        const result = await commentAPI.replyComment(parentCommentId, content);
        if (result.code === 200) {
          showToast('回复成功', 'success');
          textarea.value = '';
          const replyArea = document.getElementById(`reply-area-${parentCommentId}`);
          if (replyArea) replyArea.style.display = 'none';
          await loadComments();
        } else {
          showToast(result.message || '回复失败', 'error');
        }
      } catch (error) {
        console.error('回复失败:', error);
        showToast('回复失败，请重试', 'error');
      } finally {
        targetBtn.disabled = false;
        targetBtn.textContent = '发送';
      }
    };

    window._submitReplyDelegateHandler = submitReplyDelegateHandler;
    container.addEventListener('click', submitReplyDelegateHandler);

    // ========== 绑定编辑删除事件 ==========
    if (window._editDelegateHandler) {
      container.removeEventListener('click', window._editDelegateHandler);
    }

    const editDelegateHandler = (e) => {
      let targetBtn = e.target.closest('.btn-edit');
      if (!targetBtn) return;
      e.stopPropagation();
      openEditCommentModal(parseInt(targetBtn.dataset.id));
    };

    window._editDelegateHandler = editDelegateHandler;
    container.addEventListener('click', editDelegateHandler);

    if (window._deleteDelegateHandler) {
      container.removeEventListener('click', window._deleteDelegateHandler);
    }

    const deleteDelegateHandler = (e) => {
      let targetBtn = e.target.closest('.btn-delete');
      if (!targetBtn) return;
      e.stopPropagation();
      openDeleteCommentModal(parseInt(targetBtn.dataset.id));
    };

    window._deleteDelegateHandler = deleteDelegateHandler;
    container.addEventListener('click', deleteDelegateHandler);
  }

  function initCharCount() {
    const textarea = document.getElementById('commentContent');
    const charCount = document.getElementById('charCount');

    textarea.addEventListener('input', () => {
      const length = textarea.value.length;
      charCount.textContent = `${length}/500`;
      if (length > 500) {
        charCount.style.color = 'var(--danger)';
      } else {
        charCount.style.color = '';
      }
    });
  }

  // ✅ 修复：增强健壮性，避免 null 元素导致报错
  function updateCommentModalRatingInfo() {
    const userRatingInfo = document.getElementById('userRatingInfo');
    const noRatingWarning = document.getElementById('noRatingWarning');
    const displayUserRatingStars = document.getElementById('displayUserRatingStars');
    const displayUserRatingValue = document.getElementById('displayUserRatingValue');

    // 如果任意必需元素缺失，静默返回（不阻塞模态框打开）
    if (!userRatingInfo || !noRatingWarning) {
      console.warn('userRatingInfo 或 noRatingWarning 元素不存在，跳过评分提示更新');
      return;
    }

    if (userRating > 0) {
      userRatingInfo.style.display = 'block';
      noRatingWarning.style.display = 'none';
      if (displayUserRatingStars) {
        displayUserRatingStars.innerHTML = renderStars(userRating, 'small');
      }
      if (displayUserRatingValue) {
        displayUserRatingValue.textContent = `${userRating.toFixed(1)} 分`;
      }
    } else {
      userRatingInfo.style.display = 'none';
      noRatingWarning.style.display = 'block';
    }
  }

  function openCommentModal() {
    editingCommentId = null;
    document.getElementById('editCommentId').value = '';
    document.getElementById('commentContent').value = '';
    document.getElementById('commentModalTitle').textContent = '发布评价';
    document.getElementById('charCount').textContent = '0/500';
    document.getElementById('commentModal').classList.add('show');
  }

  function openEditCommentModal(commentId) {
    const comment = comments.find(c => c.commentId === commentId);
    if (!comment) return;

    editingCommentId = commentId;
    document.getElementById('editCommentId').value = commentId;
    document.getElementById('commentContent').value = comment.content;
    document.getElementById('commentModalTitle').textContent = '编辑评价';
    document.getElementById('charCount').textContent = `${comment.content.length}/500`;

    updateCommentModalRatingInfo();

    document.getElementById('commentModal').classList.add('show');
  }

  function closeCommentModal() {
    document.getElementById('commentModal').classList.remove('show');
  }

  async function submitComment() {
    const content = document.getElementById('commentContent').value.trim();

    if (!content) {
      showToast('请填写评价内容', 'error');
      return;
    }
    if (content.length > 500) {
      showToast('评价内容不能超过500字符', 'error');
      return;
    }

    const submitBtn = document.getElementById('submitCommentBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = '发布中...';

    try {
      let result;
      if (editingCommentId) {
        result = await commentAPI.updateComment(editingCommentId, {
          content: content
        });
      } else {
        result = await commentAPI.addComment({
          movieId: parseInt(movieId),
          content: content
        });
      }

      if (result.code === 200) {
        showToast(result.message, 'success');
        closeCommentModal();
        await loadComments();
      } else {
        showToast(result.message, 'error');
      }
    } catch (error) {
      console.error('提交评论失败:', error);
      showToast('操作失败', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '发布';
    }
  }

  // 删除评价
  function openDeleteCommentModal(commentId) {
    deleteTargetCommentId = commentId;
    document.getElementById('deleteCommentModal').classList.add('show');
  }

  function closeDeleteCommentModal() {
    deleteTargetCommentId = null;
    document.getElementById('deleteCommentModal').classList.remove('show');
  }

  async function confirmDeleteComment() {
    if (!deleteTargetCommentId) return;

    try {
      const result = await commentAPI.deleteComment(deleteTargetCommentId);
      if (result.code === 200) {
        showToast('删除成功', 'success');
        closeDeleteCommentModal();
        await loadComments();
        await loadAverageRating();
        await triggerRatingUpdate();
      } else {
        showToast(result.message, 'error');
      }
    } catch (error) {
      console.error('删除评论失败:', error);
      showToast('删除失败', 'error');
    }
  }

  // 触发全局评分更新
  async function triggerRatingUpdate() {
    try {
      const ratingResult = await commentAPI.getAverageRating(movieId);
      if (ratingResult.code === 200 && ratingResult.data && movieDetail) {
        const tmdbId = movieDetail.tmdbId;
        if (tmdbId && typeof emitRatingUpdated === 'function') {
          emitRatingUpdated(tmdbId, ratingResult.data.avgRating, ratingResult.data.count);
          console.log(`✅ 已触发评分更新事件: tmdbId=${tmdbId}, 新评分=${ratingResult.data.avgRating}`);
        }
      }
    } catch (error) {
      console.error('触发评分更新失败:', error);
    }
  }

  function bindEvents() {
    document.getElementById('openCommentBtn')?.addEventListener('click', openCommentModal);
    document.getElementById('closeCommentModalBtn')?.addEventListener('click', closeCommentModal);
    document.getElementById('cancelCommentBtn')?.addEventListener('click', closeCommentModal);
    document.getElementById('submitCommentBtn')?.addEventListener('click', submitComment);
    document.getElementById('closeDeleteCommentModalBtn')?.addEventListener('click', closeDeleteCommentModal);
    document.getElementById('cancelDeleteCommentBtn')?.addEventListener('click', closeDeleteCommentModal);
    document.getElementById('confirmDeleteCommentBtn')?.addEventListener('click', confirmDeleteComment);
  }

  async function loadComments() {
    try {
      const result = await commentAPI.getCommentsByMovie(movieId);
      if (result.code === 200) {
        comments = result.data || [];

        const token = localStorage.getItem('token');
        if (token && comments.length > 0) {
          async function fetchLikeStatus(commentList) {
            for (let comment of commentList) {
              try {
                const likeStatus = await commentAPI.getLikeStatus(comment.commentId);
                if (likeStatus.code === 200) {
                  comment.isLiked = likeStatus.data;
                }
              } catch (e) {
                comment.isLiked = false;
              }
              if (comment.replies && comment.replies.length > 0) {
                await fetchLikeStatus(comment.replies);
              }
            }
          }
          await fetchLikeStatus(comments);
        }

        renderComments();
      }
    } catch (error) {
      console.error('加载评论失败:', error);
      showToast('加载评论失败', 'error');
    }
  }
</script>
</body>
</html>
