<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>银幕记忆 - 发现电影</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 收藏模态框额外样式 */
    .collect-modal .modal-content {
      max-width: 550px;
    }
    .collect-rating {
      margin: 16px 0;
    }
    .collect-rating #collectRatingStars {
      display: flex;
      gap: 8px;
      margin: 8px 0;
    }
    .collect-rating .star {
      font-size: 32px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .collect-rating .star:hover {
      transform: scale(1.1);
    }
    .collect-rating-value {
      margin-top: 8px;
      font-size: 14px;
      color: var(--gray-600);
    }
    .form-select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      background: var(--white);
    }
    .form-select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }
    .movie-preview {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--gray-200);
    }
    .movie-preview-img {
      width: 80px;
      height: 120px;
      object-fit: cover;
      border-radius: var(--radius-sm);
    }
    .movie-preview-info {
      flex: 1;
    }
    .movie-preview-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .movie-preview-year {
      font-size: 0.8rem;
      color: var(--gray-500);
    }
    /* 轮播图样式 */
    .carousel-container {
      position: relative;
      margin-bottom: 30px;
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .carousel-slide {
      min-width: 100%;
      position: relative;
    }

    .carousel-slide img {
      width: 100%;
      height: 350px;
      object-fit: cover;
      display: block;
    }

    .carousel-slide .carousel-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      color: white;
      padding: 40px 20px 20px;
      text-align: center;
    }

    .carousel-slide .carousel-caption h3 {
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    .carousel-slide .carousel-caption p {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .carousel-prev, .carousel-next {
      transition: background 0.2s;
    }

    .carousel-prev:hover, .carousel-next:hover {
      background: rgba(0,0,0,0.8);
    }

    .carousel-dot {
      width: 10px;
      height: 10px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s;
    }

    .carousel-dot.active {
      background: var(--primary);
      width: 24px;
      border-radius: 5px;
    }

    @media (max-width: 768px) {
      .carousel-slide img {
        height: 200px;
      }
      .carousel-slide .carousel-caption h3 {
        font-size: 1rem;
      }
    }
    /* 公告图标样式 */
    .announcement-icon {
      position: relative;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .announcement-icon:hover {
      transform: scale(1.1);
    }

    .announcement-badge {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.6;
      }
    }

    /* 公告列表样式 */
    .announcement-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .announcement-item {
      padding: 16px;
      background: var(--gray-100);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s;
      border-left: 3px solid transparent;
    }

    .announcement-item:hover {
      background: var(--gray-200);
      transform: translateX(4px);
    }

    .announcement-item.unread {
      background: var(--primary-light);
      border-left-color: var(--primary);
    }

    .announcement-title {
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .announcement-title h4 {
      margin: 0;
      font-size: 1rem;
    }

    .announcement-time {
      font-size: 11px;
      color: var(--gray-500);
    }

    .announcement-content {
      font-size: 0.875rem;
      color: var(--gray-600);
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .announcement-expand {
      text-align: right;
    }

    .announcement-expand button {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 12px;
    }

    .announcement-detail {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--gray-200);
      display: none;
    }

    .announcement-detail.show {
      display: block;
    }

    .announcement-detail-content {
      font-size: 0.875rem;
      color: var(--gray-700);
      line-height: 1.6;
    }

    .no-announcement {
      text-align: center;
      padding: 40px;
      color: var(--gray-400);
    }

    .announcement-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-read {
      background: none;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      cursor: pointer;
    }

    .btn-read:hover {
      background: var(--primary);
      color: white;
    }
  </style>
</head>

      </div>

<div class="container">
  <div class="carousel-container" style="position: relative; margin-bottom: 30px; overflow: hidden; border-radius: var(--radius-xl);">
    <div id="carouselSlides" class="carousel-slides" style="display: flex; transition: transform 0.5s ease;">
      <!-- 轮播图动态加载 -->
    </div>
    <button class="carousel-prev" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10;">❮</button>
    <button class="carousel-next" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10;">❯</button>
    <div class="carousel-dots" style="position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10;"></div>

  <div class="search-section">
    <div class="search-row">
      <div class="search-input-group">
        <label>电影名称</label>
        <input type="text" id="searchTitle" placeholder="输入电影名称...">
      </div>
      <div class="search-input-group">
        <label>年份</label>
        <input type="number" id="searchYear" placeholder="上映年份">
      </div>
      <div class="search-input-group">
        <label>类型</label>
        <select id="searchGenre">
          <option value="">全部类型</option>
          <option value="28">动作</option>
          <option value="35">喜剧</option>
          <option value="18">剧情</option>
          <option value="10749">爱情</option>
          <option value="878">科幻</option>
          <option value="27">恐怖</option>
          <option value="53">悬疑</option>
          <option value="16">动画</option>
        </select>
      </div>
    </div>
    <div class="search-actions">
      <button class="btn btn-secondary" id="resetSearchBtn">重置</button>
      <button class="btn btn-primary" id="searchMoviesBtn">🔍 搜索电影</button>
    </div>
  </div>

  <div id="moviesGrid" class="movies-grid"></div>
  <div id="loadingIndicator" class="loading-more" style="display: none;">
    <div class="spinner"></div> 加载中...
  </div>
  <div id="pagination" class="pagination"></div>
</div>

<!-- 登录提示模态框 -->
<div id="loginPromptModal" class="modal login-prompt-modal">
  <div class="modal-content">

</div>

<div id="announcementModal" class="modal announcement-modal">

<!-- ✅ 新增：收藏电影模态框（完整版） -->
<div id="collectModal" class="modal collect-modal">
  <div class="modal-content">

        <input type="hidden" id="collectPosterUrl">

          <div id="collectRatingStars"></div>
          <input type="hidden" id="collectPersonalRating" value="0">

        <!-- 观影状态 -->
        <div class="form-group">
          <label class="form-label">观影状态</label>

            <option value="已看">已看</option>

          </select>

        <!-- 所属文件夹 -->

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
  let currentPage = 1;
  let totalPages = 0;
  let isLoading = false;
  let pendingAction = null;
  let pendingMovieData = null;

  // 收藏评分相关变量
  let collectRating = 0;
  let categories = [];

  // TMDB API 配置
  const TMDB_API_KEY = 'b8bd41516966d743a7cbcb3d81dc02c2';
  const TMDB_BASE_URL = 'https://api.themoviedb.org/3';

  // 页面初始化
  document.addEventListener('DOMContentLoaded', () => {
    updateUIByLoginStatus();
    bindEvents();
    searchMovies();
    loadCarousels();
    bindCarouselEvents();
    loadReadAnnouncements();
    loadAnnouncements();
    bindAnnouncementEvents();
  });

  function updateUIByLoginStatus() {
    const token = localStorage.getItem('token');
    const user = getCurrentUser();

    if (token && user) {
      document.getElementById('username').textContent = user.username || '用户';
      document.getElementById('loginLogoutBtn').textContent = '退出';
      document.getElementById('myCollectionsLink').style.display = 'inline-block';
      document.getElementById('myCommentsLink').style.display = 'inline-block';
      document.getElementById('profileLink').style.display = 'inline-block';
    } else {
      document.getElementById('username').textContent = '';
      document.getElementById('loginLogoutBtn').textContent = '登录';
      document.getElementById('myCollectionsLink').style.display = 'none';
      document.getElementById('myCommentsLink').style.display = 'none';
      document.getElementById('profileLink').style.display = 'none';
    }
  }

  function handleLoginLogout() {
    const token = localStorage.getItem('token');
    if (token) {
      logout();
      updateUIByLoginStatus();
      searchMovies();
    } else {
      window.location.href = 'login.html';
    }
  }

  function bindEvents() {
    document.getElementById('searchMoviesBtn').addEventListener('click', () => {
      currentPage = 1;
      searchMovies();
    });
    document.getElementById('resetSearchBtn').addEventListener('click', () => {
      document.getElementById('searchTitle').value = '';
      document.getElementById('searchYear').value = '';
      document.getElementById('searchGenre').value = '';
      currentPage = 1;
      searchMovies();
    });

    // 登录提示模态框事件
    document.getElementById('closePromptModalBtn').addEventListener('click', closeLoginPrompt);
    document.getElementById('cancelPromptBtn').addEventListener('click', closeLoginPrompt);
    document.getElementById('confirmLoginBtn').addEventListener('click', () => {
      sessionStorage.setItem('redirectAfterLogin', window.location.href);
      sessionStorage.setItem('pendingAction', JSON.stringify(pendingAction));
      sessionStorage.setItem('pendingMovieData', JSON.stringify(pendingMovieData));
      window.location.href = 'login.html';
    });

    // 收藏模态框事件
    document.getElementById('closeCollectModalBtn').addEventListener('click', closeCollectModal);
    document.getElementById('cancelCollectBtn').addEventListener('click', closeCollectModal);
    document.getElementById('confirmCollectBtn').addEventListener('click', confirmCollect);
  }

  function showLoginPrompt(message, action, movieData = null) {
    pendingAction = action;
    pendingMovieData = movieData;
    document.getElementById('promptMessage').textContent = message || '此操作需要登录账号，请先登录';
    document.getElementById('loginPromptModal').classList.add('show');
  }

  function closeLoginPrompt() {
    pendingAction = null;
    pendingMovieData = null;
    document.getElementById('loginPromptModal').classList.remove('show');
  }

  // 搜索电影 (调用TMDB)
  async function searchMovies() {
    if (isLoading) return;
    isLoading = true;
    document.getElementById('loadingIndicator').style.display = 'flex';

    const title = document.getElementById('searchTitle').value;
    const year = document.getElementById('searchYear').value;
    const genre = document.getElementById('searchGenre').value;

    let url;
    if (title) {
      url = `${API_BASE_URL}/tmdb/search/movie?page=${currentPage}&query=${encodeURIComponent(title)}`;
      if (year) url += `&year=${year}`;
      if (genre) url += `&with_genres=${genre}`;
    } else {
      url = `${API_BASE_URL}/tmdb/movie/popular?page=${currentPage}`;
      if (year) url += `&year=${year}`;
      if (genre) url += `&with_genres=${genre}`;
    }

    try {
      const response = await fetch(url);
      const data = await response.json();

      if (data.results) {
        totalPages = data.total_pages > 500 ? 500 : data.total_pages;
        renderMovies(data.results);
        renderPagination();
      } else {
        document.getElementById('moviesGrid').innerHTML = '<div class="empty-state"><div class="empty-state-icon">🎬</div><p>暂无电影数据</p></div>';
      }
    } catch (error) {
      console.error('搜索失败:', error);
      showToast('搜索失败，请检查网络', 'error');
      document.getElementById('moviesGrid').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><p>搜索失败，请检查网络连接</p></div>';
    } finally {
      isLoading = false;
      document.getElementById('loadingIndicator').style.display = 'none';
    }
  }

  function renderMovies(movies) {
    const grid = document.getElementById('moviesGrid');
    if (!movies || movies.length === 0) {
      grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🎬</div><p>没有找到相关电影</p></div>';
      return;
    }

    grid.innerHTML = movies.map(movie => `
      <div class="card movie-card" data-movie-id="${movie.id}">
        <img src="${movie.poster_path ? 'https://image.tmdb.org/t/p/w500' + movie.poster_path : 'https://via.placeholder.com/300x450?text=No+Poster'}"
             class="movie-poster"
             alt="${escapeHtml(movie.title)}"
             onerror="this.src='https://via.placeholder.com/300x450?text=No+Poster'">
        <div class="movie-info">
          <h3 class="movie-title">${escapeHtml(movie.title)}</h3>
          <p class="movie-year">${movie.release_date ? movie.release_date.split('-')[0] : '未知'}</p>
          <div class="stars-container">${renderStars(movie.vote_average / 2, 'small')}</div>
          <div style="margin-top: 12px;">
            <button class="btn btn-primary btn-sm view-detail" data-movie='${JSON.stringify(movie)}'>查看详情</button>
            <button class="btn btn-secondary btn-sm collect-movie" data-movie='${JSON.stringify(movie)}'>⭐ 收藏</button>
          </div>
        </div>
      </div>
    `).join('');

    // 绑定卡片点击和按钮事件
    document.querySelectorAll('.movie-card').forEach(card => {
      const viewBtn = card.querySelector('.view-detail');
      const collectBtn = card.querySelector('.collect-movie');
      const movieData = JSON.parse(viewBtn.dataset.movie);

      card.addEventListener('click', (e) => {
        if (e.target.classList.contains('view-detail') || e.target.classList.contains('collect-movie')) return;
        showMovieDetail(movieData);
      });

      viewBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        showMovieDetail(movieData);
      });

      // ✅ 新增：收藏按钮事件
      collectBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const token = localStorage.getItem('token');
        if (!token) {
          showLoginPrompt('收藏电影需要登录，请先登录', { type: 'collect', movieData: movieData });
        } else {
          openCollectModal(movieData);
        }
      });
    });
  }

  function renderPagination() {
    if (totalPages <= 1) {
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    let html = '<div class="pagination-container">';
    html += `<button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" data-page="1" ${currentPage === 1 ? 'disabled' : ''}>首页</button>`;
    html += `<button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" data-page="${currentPage - 1}" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>`;

    let startPage = Math.max(1, currentPage - 3);
    let endPage = Math.min(totalPages, currentPage + 3);

    if (endPage - startPage < 6) {
      if (startPage === 1) {
        endPage = Math.min(totalPages, startPage + 6);
      } else if (endPage === totalPages) {
        startPage = Math.max(1, endPage - 6);
      }
    }

    if (startPage > 1) {
      html += `<span class="page-ellipsis">...</span>`;
    }

    for (let i = startPage; i <= endPage; i++) {
      html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
    }

    if (endPage < totalPages) {
      html += `<span class="page-ellipsis">...</span>`;
    }

    html += `<button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" data-page="${currentPage + 1}" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>`;
    html += `<button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" data-page="${totalPages}" ${currentPage === totalPages ? 'disabled' : ''}>尾页</button>`;

    html += `<div class="page-jump">
                <span>跳转到</span>
                <input type="number" id="jumpPageInput" class="page-jump-input"
                       min="1" max="${totalPages}" value="${currentPage}"
                       style="width: 60px; text-align: center;">
                <span>页</span>
                <button class="page-btn page-jump-btn" id="jumpPageBtn">GO</button>
            </div>`;

    html += '</div>';
    document.getElementById('pagination').innerHTML = html;

    document.querySelectorAll('.page-btn:not(.disabled)').forEach(btn => {
      if (!btn.disabled) {
        btn.addEventListener('click', () => {
          const page = parseInt(btn.dataset.page);
          if (!isNaN(page) && page !== currentPage && page >= 1 && page <= totalPages) {
            currentPage = page;
            searchMovies();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });
      }
    });

    const jumpBtn = document.getElementById('jumpPageBtn');
    if (jumpBtn) {
      jumpBtn.addEventListener('click', () => {
        const jumpInput = document.getElementById('jumpPageInput');
        let targetPage = parseInt(jumpInput.value);
        if (isNaN(targetPage)) targetPage = 1;
        targetPage = Math.max(1, Math.min(totalPages, targetPage));
        if (targetPage !== currentPage) {
          currentPage = targetPage;
          searchMovies();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
    }
  }

  // ✅ 初始化收藏评分星星
  function initCollectRatingStars() {
    const container = document.getElementById('collectRatingStars');
    if (!container) return;
    container.innerHTML = '';
    collectRating = 0;

    for (let i = 1; i <= 5; i++) {
      const star = document.createElement('span');
      star.className = 'star';
      star.setAttribute('data-value', i);
      star.innerHTML = '★';
      star.style.fontSize = '32px';
      star.style.cursor = 'pointer';
      star.style.display = 'inline-block';
      star.style.position = 'relative';

      updateCollectStarDisplay(star, i, collectRating);

      star.onclick = (function(starValue) {
        return function(e) {
          const rect = this.getBoundingClientRect();
          const mouseX = e.clientX - rect.left;
          const starWidth = rect.width;
          const isHalf = mouseX < starWidth / 2;
          let newRating = starValue;
          if (isHalf) {
            newRating = starValue - 0.5;
            if (newRating < 0) newRating = 0;
          }
          setCollectRating(newRating);
        };
      })(i);

      star.onmousemove = (function(starValue) {
        return function(e) {
          const rect = this.getBoundingClientRect();
          const mouseX = e.clientX - rect.left;
          const starWidth = rect.width;
          const isHalf = mouseX < starWidth / 2;
          const previewValue = isHalf ? starValue - 0.5 : starValue;
          previewCollectRating(previewValue);
        };
      })(i);

      star.onmouseleave = () => resetCollectStarsDisplay();

      container.appendChild(star);
    }
  }

  function updateCollectStarDisplay(star, starValue, rating) {
    star.classList.remove('half-star');
    if (rating >= starValue) {
      star.style.color = '#fbbf24';
    } else if (rating >= starValue - 0.5) {
      star.classList.add('half-star');
      star.style.color = '#d1d5db';
    } else {
      star.style.color = '#d1d5db';
    }
  }

  function previewCollectRating(previewValue) {
    const allStars = document.querySelectorAll('#collectRatingStars .star');
    allStars.forEach((star, index) => {
      const starValue = index + 1;
      star.classList.remove('half-star');
      if (previewValue >= starValue) {
        star.style.color = '#fbbf24';
      } else if (previewValue >= starValue - 0.5) {
        star.classList.add('half-star');
        star.style.color = '#d1d5db';
      } else {
        star.style.color = '#d1d5db';
      }
    });
    const ratingDisplay = document.getElementById('collectRatingDisplay');
    if (ratingDisplay) {
      ratingDisplay.textContent = `当前评分：${previewValue.toFixed(1)} 分`;
      ratingDisplay.style.color = '#f59e0b';
    }
  }

  function resetCollectStarsDisplay() {
    const allStars = document.querySelectorAll('#collectRatingStars .star');
    allStars.forEach((star, index) => {
      const starValue = index + 1;
      updateCollectStarDisplay(star, starValue, collectRating);
    });
    const ratingDisplay = document.getElementById('collectRatingDisplay');
    if (ratingDisplay) {
      ratingDisplay.textContent = `当前评分：${collectRating.toFixed(1)} 分`;
      ratingDisplay.style.color = '';
    }
  }

  function setCollectRating(value) {
    collectRating = value;
    document.getElementById('collectPersonalRating').value = value;
    const allStars = document.querySelectorAll('#collectRatingStars .star');
    allStars.forEach((star, index) => {
      const starValue = index + 1;
      updateCollectStarDisplay(star, starValue, collectRating);
    });
    const ratingDisplay = document.getElementById('collectRatingDisplay');
    if (ratingDisplay) {
      ratingDisplay.textContent = `当前评分：${collectRating.toFixed(1)} 分`;
    }
  }

  // ✅ 确认收藏
  async function confirmCollect() {
    const tmdbId = document.getElementById('collectTmdbId').value;
    const movieName = document.getElementById('collectMovieName').value;
    const posterUrl = document.getElementById('collectPosterUrl').value;
    const year = document.getElementById('collectYearValue').value;
    const watchStatus = document.getElementById('collectWatchStatus').value;
    const privateReview = document.getElementById('collectPrivateReview').value;
    const categoryId = document.getElementById('collectCategoryId').value;
    const personalRating = collectRating;

    // 验证评分
    if (personalRating === 0) {
      showToast('请给电影评分（点击星星）', 'warning');
      return;
    }

    // 先获取电影详情（包含导演、类型等信息）
    showToast('正在获取电影信息...', 'info');

    try {
      const detailResponse = await fetch(`${API_BASE_URL}/tmdb/movie/${tmdbId}`);
      const fullMovieData = await detailResponse.json();

      // 解析导演
      let director = '';
      if (fullMovieData.credits && fullMovieData.credits.crew) {
        const directorObj = fullMovieData.credits.crew.find(person => person.job === 'Director');
        if (directorObj) {
          director = directorObj.name;
        }
      }

      // 解析类型
      let genre = '';
      if (fullMovieData.genres && fullMovieData.genres.length > 0) {
        genre = fullMovieData.genres.map(g => g.name).join('、');
      }

      // 解析地区
      let region = '';
      if (fullMovieData.production_countries && fullMovieData.production_countries.length > 0) {
        region = fullMovieData.production_countries[0].name;
      }

      const movieData = {
        tmdbId: parseInt(tmdbId),
        movieName: movieName,
        director: director,
        year: year ? parseInt(year) : null,
        posterUrl: posterUrl,
        genre: genre,
        region: region,
        personalRating: personalRating,
        watchStatus: watchStatus,
        privateReview: privateReview,
        categoryId: categoryId ? parseInt(categoryId) : null
      };

      const result = await movieAPI.addMovie(movieData);

      if (result.code === 200) {
        showToast('收藏成功！', 'success');
        closeCollectModal();
      } else {
        showToast(result.message || '收藏失败', 'error');
      }
    } catch (error) {
      console.error('收藏失败:', error);
      showToast('收藏失败，请重试', 'error');
    }
  }

  // ==================== 轮播图功能 ====================

  let carouselData = [];
  let currentSlide = 0;
  let carouselInterval = null;
  let isDragging = false;
  let startX = 0;
  let currentTranslate = 0;

  /**
   * 加载轮播图数据
   */
  async function loadCarousels() {
    try {
      const response = await fetch(`${API_BASE_URL}/admin/system/carousels/active`);
      const result = await response.json();
      if (result.code === 200 && result.data && result.data.length > 0) {
        carouselData = result.data;
        renderCarousel();
        startCarouselAutoPlay();
      } else {
        // 没有轮播图时隐藏轮播图容器
        const container = document.querySelector('.carousel-container');
        if (container) container.style.display = 'none';
      }
    } catch (error) {
      console.error('加载轮播图失败:', error);
      const container = document.querySelector('.carousel-container');
      if (container) container.style.display = 'none';
    }
  }

  /**
   * 渲染轮播图
   */
  function renderCarousel() {
    const slidesContainer = document.getElementById('carouselSlides');
    const dotsContainer = document.querySelector('.carousel-dots');

    if (!slidesContainer || carouselData.length === 0) return;

    // 渲染幻灯片
    slidesContainer.innerHTML = carouselData.map((item, index) => `
    <div class="carousel-slide" data-index="${index}">
      <img src="${item.imageUrl}" alt="${escapeHtml(item.title || '轮播图')}" onerror="this.src='https://via.placeholder.com/1200x400?text=Image+Load+Error'">
      ${item.title ? `
        <div class="carousel-caption">
          <h3>${escapeHtml(item.title)}</h3>
          ${item.linkUrl ? `<p>点击查看详情</p>` : ''}
        </div>
      ` : ''}
      ${item.linkUrl ? `<a href="${item.linkUrl}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;"></a>` : ''}
    </div>
  `).join('');

    // 绑定点击跳转（使用独立的事件绑定）
    carouselData.forEach((item, index) => {
      if (item.linkUrl) {
        const slide = slidesContainer.querySelector(`.carousel-slide[data-index="${index}"]`);
        if (slide) {
          slide.style.cursor = 'pointer';
          slide.addEventListener('click', () => {
            window.open(item.linkUrl, '_blank');
          });
        }
      }
    });

    // 渲染指示点
    dotsContainer.innerHTML = carouselData.map((_, index) => `
    <span class="carousel-dot ${index === 0 ? 'active' : ''}" data-index="${index}"></span>
  `).join('');

    // 绑定指示点点击事件
    document.querySelectorAll('.carousel-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        const index = parseInt(dot.dataset.index);
        goToSlide(index);
        resetAutoPlay();
      });
    });

    // 设置初始位置
    updateSlidePosition();
  }

  /**
   * 切换到指定幻灯片
   */
  function goToSlide(index) {
    if (index < 0) index = carouselData.length - 1;
    if (index >= carouselData.length) index = 0;
    currentSlide = index;
    updateSlidePosition();
    updateDots();
  }

  /**
   * 更新幻灯片位置
   */
  function updateSlidePosition() {
    const slidesContainer = document.getElementById('carouselSlides');
    if (!slidesContainer) return;
    slidesContainer.style.transform = `translateX(-${currentSlide * 100}%)`;
  }

  /**
   * 更新指示点状态
   */
  function updateDots() {
    document.querySelectorAll('.carousel-dot').forEach((dot, index) => {
      if (index === currentSlide) {
        dot.classList.add('active');
      } else {
        dot.classList.remove('active');
      }
    });
  }

  /**
   * 下一张
   */
  function nextSlide() {
    goToSlide(currentSlide + 1);
    resetAutoPlay();
  }

  /**
   * 上一张
   */
  function prevSlide() {
    goToSlide(currentSlide - 1);
    resetAutoPlay();
  }

  /**
   * 启动自动轮播
   */
  function startCarouselAutoPlay() {
    if (carouselInterval) clearInterval(carouselInterval);
    carouselInterval = setInterval(() => {
      nextSlide();
    }, 5000); // 5秒切换一次
  }

  /**
   * 重置自动轮播
   */
  function resetAutoPlay() {
    if (carouselInterval) {
      clearInterval(carouselInterval);
      startCarouselAutoPlay();
    }
  }

  /**
   * 绑定轮播图控制按钮事件
   */
  function bindCarouselEvents() {
    const prevBtn = document.querySelector('.carousel-prev');
    const nextBtn = document.querySelector('.carousel-next');

    if (prevBtn) {
      prevBtn.addEventListener('click', () => {
        prevSlide();
        resetAutoPlay();
      });
    }

    if (nextBtn) {
      nextBtn.addEventListener('click', () => {
        nextSlide();
        resetAutoPlay();
      });
    }

    // 触摸滑动支持（手机端）
    const container = document.querySelector('.carousel-container');
    if (container) {
      container.addEventListener('touchstart', handleTouchStart);
      container.addEventListener('touchmove', handleTouchMove);
      container.addEventListener('touchend', handleTouchEnd);
    }
  }

  /**
   * 触摸开始
   */
  function handleTouchStart(e) {
    isDragging = true;
    startX = e.touches[0].clientX;
    resetAutoPlay();
  }

  /**
   * 触摸移动
   */
  function handleTouchMove(e) {
    if (!isDragging) return;
    const currentX = e.touches[0].clientX;
    const diff = currentX - startX;
    if (Math.abs(diff) > 50) {
      if (diff > 0) {
        prevSlide();
      } else {
        nextSlide();
      }
      isDragging = false;
    }
  }

  /**
   * 触摸结束
   */
  function handleTouchEnd() {
    isDragging = false;
  }



  let announcements = [];
  let readAnnouncementIds = new Set();

  // 从 localStorage 读取已读公告ID
  function loadReadAnnouncements() {
    const stored = localStorage.getItem('readAnnouncements');
    if (stored) {
      try {
        readAnnouncementIds = new Set(JSON.parse(stored));
      } catch (e) {
        readAnnouncementIds = new Set();
      }
    }
  }

  // 保存已读公告ID到 localStorage
  function saveReadAnnouncements() {
    localStorage.setItem('readAnnouncements', JSON.stringify([...readAnnouncementIds]));
  }

  // 加载公告列表
  async function loadAnnouncements() {
    try {
      const token = localStorage.getItem('token');
      let url;

      if (token) {
        // 已登录用户：使用带用户过滤的接口
        url = `${API_BASE_URL}/admin/system/user/announcements`;
      } else {
        // 未登录用户：使用公开接口（只显示全体公告）
        url = `${API_BASE_URL}/admin/system/public/announcements`;
      }

      const response = await fetch(url, {
        headers: token ? { 'Authorization': `Bearer ${token}` } : {}
      });
      const result = await response.json();
      if (result.code === 200) {
        announcements = result.data || [];
        renderAnnouncementList();
        updateAnnouncementBadge();
      }
    } catch (error) {
      console.error('加载公告失败:', error);
    }
  }

  // 更新公告小喇叭的红点提示
  function updateAnnouncementBadge() {
    const badge = document.getElementById('announcementBadge');
    if (!badge) return;

    // 计算未读公告数量
    const unreadCount = announcements.filter(a => !readAnnouncementIds.has(a.id)).length;

    if (unreadCount > 0) {
      badge.style.display = 'block';
      badge.textContent = unreadCount > 9 ? '9+' : unreadCount;
    } else {
      badge.style.display = 'none';
    }
  }

  // 渲染公告列表到弹窗
  // 修改公告弹窗渲染函数
  function renderAnnouncementList() {
    const isLoggedIn = !!localStorage.getItem('token');
    const container = document.getElementById('announcementModalBody');

    if (announcements.length === 0) {
      container.innerHTML = `<div class="no-announcement">📭<p>暂无公告</p></div>`;
      return;
    }

    container.innerHTML = `
    <div class="announcement-list">
      ${announcements.map(announcement => `
        <div class="announcement-item ${isLoggedIn && !readAnnouncementIds.has(announcement.id) ? 'unread' : ''}" data-id="${announcement.id}">
          <div class="announcement-title">
            <h4>${escapeHtml(announcement.title)}</h4>
            <span class="announcement-time">${formatDate(announcement.createTime)}</span>
          </div>
          <div class="announcement-content">
            ${escapeHtml(announcement.content.length > 80 ? announcement.content.substring(0, 80) + '...' : announcement.content)}
          </div>
          ${isLoggedIn ? `
            <div class="announcement-actions">
              <button class="btn-read" data-id="${announcement.id}" data-action="read">标记已读</button>
              <button class="btn-read" data-id="${announcement.id}" data-action="detail">查看详情</button>
            </div>
          ` : ''}
          <div class="announcement-detail" id="detail-${announcement.id}">
            <div class="announcement-detail-content">${escapeHtml(announcement.content)}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;

    // 只有登录用户才绑定标记已读事件
    if (isLoggedIn) {
      document.querySelectorAll('.btn-read[data-action="read"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = parseInt(btn.dataset.id);
          markAsRead(id);
        });
      });
    }

    // 查看详情按钮（登录/未登录都可以）
    document.querySelectorAll('.btn-read[data-action="detail"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = parseInt(btn.dataset.id);
        toggleDetail(id);
      });
    });
  }

  // 标记公告为已读
  function markAsRead(id) {
    if (!readAnnouncementIds.has(id)) {
      readAnnouncementIds.add(id);
      saveReadAnnouncements();

      // 更新UI
      const item = document.querySelector(`.announcement-item[data-id="${id}"]`);
      if (item) {
        item.classList.remove('unread');
      }
      updateAnnouncementBadge();

      showToast('已标记为已读', 'success');
    }
  }

  // 展开/收起公告详情
  function toggleDetail(id) {
    const detailEl = document.getElementById(`detail-${id}`);
    if (detailEl) {
      detailEl.classList.toggle('show');
    }
  }

  // 打开公告弹窗
  function openAnnouncementModal() {
    renderAnnouncementList();
    document.getElementById('announcementModal').classList.add('show');
  }

  // 关闭公告弹窗
  function closeAnnouncementModal() {
    document.getElementById('announcementModal').classList.remove('show');
  }

  // 绑定公告相关事件
  function bindAnnouncementEvents() {
    const icon = document.getElementById('announcementIcon');
    const closeBtn = document.getElementById('closeAnnouncementModalBtn');
    const markReadBtn = document.getElementById('markReadBtn');

    if (icon) {
      icon.addEventListener('click', openAnnouncementModal);
    }

    if (closeBtn) {
      closeBtn.addEventListener('click', closeAnnouncementModal);
    }

    if (markReadBtn) {
      markReadBtn.addEventListener('click', () => {
        // 一键标记所有公告为已读
        announcements.forEach(a => {
          if (!readAnnouncementIds.has(a.id)) {
            readAnnouncementIds.add(a.id);
          }
        });
        saveReadAnnouncements();
        renderAnnouncementList();
        updateAnnouncementBadge();
        showToast('已标记所有公告为已读', 'success');
      });
    }

    // 点击模态框背景关闭
    const modal = document.getElementById('announcementModal');
    if (modal) {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          closeAnnouncementModal();
        }
      });
    }
  }

  setTimeout(checkPendingAction, 500);
</script>
</body>
